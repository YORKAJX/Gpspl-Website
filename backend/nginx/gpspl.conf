server {
    listen 80;
    server_name gpspl.co.in www.gpspl.co.in;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name gpspl.co.in www.gpspl.co.in;

    # Configure these certificate paths through your certificate manager.
    ssl_certificate /etc/letsencrypt/live/gpspl.co.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gpspl.co.in/privkey.pem;

    server_tokens off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    brotli on;
    brotli_comp_level 5;
    brotli_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Powered-By;
    }

    location / {
        root /var/www/gpspl;
        try_files $uri $uri.html $uri/ /404.html;
        add_header Cache-Control "public, max-age=300";
    }

    location ~* \.(css|js|jpg|jpeg|png|webp|svg|ico|woff2?)$ {
        root /var/www/gpspl;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }
}
